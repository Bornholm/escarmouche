label:
  fr-FR: Repli Tactique
  en-EN: Tactical Retreat
  es-ES: Retirada Táctica
description:
  fr-FR: |-
    Effectuez une action de mouvement. Cette unité ne peut pas être 
    la cible d'attaques jusqu'au début de son prochain tour.
  en-EN: |-
    Perform a movement action. This unit cannot be targeted by attacks 
    until the start of its next turn.
  es-ES: |-
    Realiza una acción de movimiento. Esta unidad no puede ser
    objetivo de ataques hasta el inicio de su próximo turno.
cost: 4
